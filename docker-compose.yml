services:
  postgres:
    image: postgres:16-alpine
    container_name: ericoid_postgres
    environment:
      POSTGRES_USER: ericoid_user
      POSTGRES_PASSWORD: ericoid_password
      POSTGRES_DB: ericoid_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ericoid_user -d ericoid_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stable_network

  redis:
    image: redis:7-alpine
    container_name: ericoid_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stable_network

volumes:
  postgres_data:
  redis_data:

networks:
  stable_network:
    driver: bridge
